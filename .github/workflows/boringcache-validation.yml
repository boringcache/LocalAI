name: BoringCache llama.cpp CPU validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Cache phase
        required: true
        type: choice
        options: [connect, cold, warm, rolling]
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: localai-llama-cpp-cpu-validation
  cancel-in-progress: false

jobs:
  connect:
    if: inputs.phase == 'connect' && github.repository == 'boringcache/LocalAI' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install BoringCache CLI for enrollment
        run: |
          curl -fsSL https://install.boringcache.com/install.sh -o "$RUNNER_TEMP/install-boringcache.sh"
          sh "$RUNNER_TEMP/install-boringcache.sh"
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"
      - name: Connect GitHub OIDC
        run: boringcache ci connect --oidc-provider github-actions

  build:
    name: ${{ matrix.provider }} CPU ${{ inputs.phase }}
    if: inputs.phase != 'connect' && github.repository == 'boringcache/LocalAI' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        provider: [Registry, BoringCache]
    env:
      CACHE_REF: ghcr.io/boringcache/localai-validation-cache:cpu-amd64-20260930
    steps:
      - name: Checkout validation plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: operator
          persist-credentials: false

      - name: Select upstream source
        id: source
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          source_sha=$(cat operator/.github/boringcache-upstream)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/validation"
          printf 'BORINGCACHE_OBSERVABILITY_JSONL_PATH=%s/validation/boringcache-telemetry.jsonl\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$source_sha" > "$RUNNER_TEMP/validation/upstream-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/validation/workflow-sha.txt"
          printf '%s\n' "$PHASE" > "$RUNNER_TEMP/validation/phase.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/validation/run-id.txt"
          {
            uname -a
            nproc
            free -h
            df -h
          } > "$RUNNER_TEMP/validation/runner.txt"

      - name: Checkout pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mudler/LocalAI
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Verify source and build inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
          git -C upstream status --porcelain > "$RUNNER_TEMP/validation/source-status.txt"
          test ! -s "$RUNNER_TEMP/validation/source-status.txt"
          sha256sum upstream/backend/Dockerfile.llama-cpp \
            upstream/.docker/llama-cpp-compile.sh \
            upstream/.docker/llama-cpp-build-target.sh \
            upstream/backend/cpp/llama-cpp/Makefile \
            > "$RUNNER_TEMP/validation/build-inputs.sha256"
          cp operator/.boringcache.toml "$RUNNER_TEMP/validation/plan.toml"

      - name: Configure upstream apt mirror
        uses: ./upstream/.github/actions/configure-apt-mirror

      - name: Set up upstream build disk
        uses: ./upstream/.github/actions/setup-build-disk

      - name: Record Docker versions
        run: |
          docker version > "$RUNNER_TEMP/validation/docker-version.txt"
          docker buildx version > "$RUNNER_TEMP/validation/buildx-version.txt"
          df -h > "$RUNNER_TEMP/validation/disk-before.txt"

      - name: Set up registry-control builder
        if: matrix.provider == 'Registry'
        id: registry_builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to fork registry
        if: matrix.provider == 'Registry'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build start
        run: date +%s > "$RUNNER_TEMP/validation/build-start.txt"

      - name: Build with registry cache
        if: matrix.provider == 'Registry'
        working-directory: operator
        shell: bash
        env:
          BUILDER: ${{ steps.registry_builder.outputs.name }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          mapfile -t command < <(python3 -c 'import tomllib; p=tomllib.load(open(".boringcache.toml", "rb")); print("\n".join(p["adapters"]["docker"]["command"]))')
          cache_args=()
          if [ "$PHASE" != cold ]; then
            cache_args+=(--cache-from "type=registry,ref=$CACHE_REF")
          fi
          if [ "$PHASE" != warm ]; then
            cache_args+=(--cache-to "type=registry,ref=$CACHE_REF,mode=max,ignore-error=false")
          fi
          "${command[@]}" --builder "$BUILDER" "${cache_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/validation/build.log"

      - name: Build with BoringCache and persistent ccache mount
        if: matrix.provider == 'BoringCache' && inputs.phase != 'warm'
        id: boringcache
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1.33.0
        with:
          working-directory: operator
          mode: docker
          cli-version: ${{ inputs.cli_version }}
          trust-policy: publish
          diagnostics: summary
          fail-on-cache-error: true

      - name: Restore with BoringCache and persistent ccache mount
        if: matrix.provider == 'BoringCache' && inputs.phase == 'warm'
        id: boringcache_restore
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1.33.0
        with:
          working-directory: operator
          mode: docker
          cli-version: ${{ inputs.cli_version }}
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true

      - name: Record build duration
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/validation/build-start.txt" ]; then
            started=$(cat "$RUNNER_TEMP/validation/build-start.txt")
            printf 'build_step_seconds=%s\n' "$(($(date +%s) - started))" \
              > "$RUNNER_TEMP/validation/timing.txt"
          fi
          df -h > "$RUNNER_TEMP/validation/disk-after.txt"

      - name: Verify backend package
        shell: bash
        run: |
          set -euo pipefail
          test -s package/run.sh
          test -s package/llama-cpp-cpu-all
          test -s package/llama-cpp-grpc
          test -s package/llama-cpp-rpc-server
          file package/llama-cpp-cpu-all package/llama-cpp-grpc package/llama-cpp-rpc-server \
            > "$RUNNER_TEMP/validation/package-types.txt"
          find package -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/validation/package.sha256"
          du -sb package > "$RUNNER_TEMP/validation/package-size.txt"

      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider }}-${{ inputs.phase }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.boringcache.outputs.evidence-path }}
            ${{ steps.boringcache_restore.outputs.evidence-path }}
          retention-days: 30
